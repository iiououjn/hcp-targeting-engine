[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcp-targeting-engine"
version = "0.1.0"
description = "HCP segmentation and targeting: behavioral clustering plus SHAP-explained propensity-to-prescribe scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pharma", "commercial-analytics", "hcp", "segmentation", "propensity", "shap", "scikit-learn"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.45",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
types = ["mypy>=1.11"]

[project.scripts]
hcp-engine = "hcp_engine.cli:main"
hcp-engine-plus = "hcp_engine_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = ["src/hcp_engine_plus"]
