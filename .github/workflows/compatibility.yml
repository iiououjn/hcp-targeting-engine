name: Oldest supported dependencies
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  old-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install oldest declared stack (Python 3.10)
        run: |
          python -m pip install -e '.[dev]' \
            'numpy==1.24.4' 'pandas==2.0.3' 'scikit-learn==1.3.2' \
            'shap==0.45.1' 'matplotlib==3.7.5' 'joblib==1.3.2'
      - name: Verify versions and tests
        run: |
          python -m pip check
          python -m pip freeze | grep -E '^(numpy|pandas|scikit-learn|shap|matplotlib|joblib)=='
          pytest -q
